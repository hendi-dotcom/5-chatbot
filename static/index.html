<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> AI Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Gemini AI Chatbot</h1>
      <div id="chat-box" class="chat-box">
        <!-- Indikator pengetikan akan muncul di sini -->
        <div id="typing-indicator" class="message model-message hidden">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <form id="chat-form">
        <input type="text" id="user-input" placeholder="Ketik pesanmu..." autocomplete="off" required />
        <button type="submit">Kirim</button>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
